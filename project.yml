name: PetSoul
options:
  bundleIdPrefix: com.silifield
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PetSoul:
    type: application
    platform: iOS
    sources:
      - path: PetSoulApp/PetSoulApp
    resources:
      - path: PetSoulApp/PetSoulApp/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silifield.petsoul
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "硅宠场域"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于扫码添加设备和识别宠物"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "用于连接硅宠探针智能设备"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
