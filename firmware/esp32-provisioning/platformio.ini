; Reference board only. Confirm the actual module Flash/PSRAM and pin map before production.
[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32@6.10.0
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.3.1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

; Legacy reference retained for existing provisioning development.
[env:esp32dev]
board = esp32dev
