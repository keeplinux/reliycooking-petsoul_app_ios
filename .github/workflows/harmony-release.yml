name: Publish HarmonyOS NEXT preview

on:
  push:
    tags: ['v*-harmony.*']

permissions: {}

concurrency:
  group: harmony-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify committed Release HAP
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-harmony\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION%%-harmony.*}"
          ARTIFACT_DIR="artifacts/harmony/$VERSION"
          HAP="$ARTIFACT_DIR/silifield-$VERSION-harmony-next-unsigned.hap"
          python3 scripts/verify-harmony-package.py "$HAP" --require-release
          (cd "$ARTIFACT_DIR" && sha256sum -c SHA256SUMS.txt)
          test -s "$ARTIFACT_DIR/INSTALL.md"
          test -s "docs/releases/HARMONY_v$VERSION.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          echo "HAP=$HAP" >> "$GITHUB_ENV"
      - name: Upload verified assets and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/harmony-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/harmony-is-draft")" != "true" ]]; then
              echo 'Release is already published; leaving it unchanged.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "硅宠场域 $VERSION · HarmonyOS NEXT 未签名预览版" \
              --notes-file "docs/releases/HARMONY_v$VERSION.md"
          fi
          gh release upload "$RELEASE_TAG" "$HAP" "$ARTIFACT_DIR/SHA256SUMS.txt" "$ARTIFACT_DIR/INSTALL.md" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
